[package]
name = "beatcraft-editor"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/westbot657/BeatcraftMeshEditor"
description = "A Mesh editor for Beatcraft and Beatmap editor for Beat Saber"

[[bin]]
name = "beatcraft_editor"
path = "src/main.rs"

[features]
default = ["mesh-editor", "mapper"]
mesh-editor = []
mapper = []

[dependencies]
eframe = { version = "0.33.3", features = ["glow", "persistence"] }
egui = { version = "0.33.3", features = ["persistence", "serde"] }
egui_extras = { version = "0.33.3", features = ["all_loaders"] }
glam = { version = "0.33.5", features = ["bytemuck", "serde"] }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
parking_lot = "0.13"
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.17"
indexmap = { version = "2.13.0", features = ["serde"] }
regex = "1.12.3"
anyhow = "1"
image = "0.25.10"
num-traits = "0.2.19"
dirs = "7.0.0"
chrono = "0.4.45"
thiserror = "2"
clap = { version = "4.6.2", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
bitflags = { version = "2.13.1", features = ["serde"] }
rand = "0.10.2"
keybinds = { version = "0.2.0", features = ["serde"] }
fluent-templates = "0.15.1"
bs-mapping-data = { path = "../bs_mapping_data" }
beatcraft_editor_proc = { path = "../beatcraft_editor_proc" }
beatmap-core = { path = "../beatmap_core", features = ["beatcraft_worldspace"] }
beatcraft-audiolib = { path = "../beatcraft_audiolib", features = ["spectrogram", "tracing"] }

